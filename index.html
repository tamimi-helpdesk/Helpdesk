    <script>
      // Suppress cross-origin and benign iframe error noise
      window.addEventListener('error', function(event) {
        var msg = event && event.message ? String(event.message) : '';
        if (
          msg === 'Script error.' ||
          msg.indexOf('ResizeObserver') !== -1 ||
          msg.indexOf('failed to connect to websocket') !== -1
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason ? String(event.reason.message || event.reason) : '';
        if (
          reason.indexOf('ResizeObserver') !== -1 ||
          reason.indexOf('failed to connect to websocket') !== -1
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
